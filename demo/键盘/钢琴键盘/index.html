<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>钢琴键盘</title>
</head>
<body>
  <h1>🎹 钢琴键盘</h1>
  
  <div class="display">
    <p>当前音符</p>
    <div class="note-name" id="noteDisplay">--</div>
  </div>

  <div class="piano-wrapper">
      <div class="piano-container">
        <div class="piano" id="piano">
          <div class="white-keys" id="whiteKeys"></div>
          <div class="black-keys" id="blackKeys"></div>
        </div>
      </div>
    </div>

  <div class="instructions">
    <p>🎵 点击琴键播放音符</p>
    <p>⌨️ 键盘输入: A-L 对应中间八度白键，W-E-T-Y-U-I-O 对应黑键</p>
  </div>

  <script>
    class Piano {
      constructor() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        this.noteDisplay = document.getElementById('noteDisplay');
        this.whiteKeysContainer = document.getElementById('whiteKeys');
        this.blackKeysContainer = document.getElementById('blackKeys');
        
        this.whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        this.blackNotePositions = [1, 2, 4, 5, 6];
        this.isMouseDown = false;
        
        this.createPiano();
        this.init();
      }

      createPiano() {
        const startOctave = 2;
        const endOctave = 6;
        const allWhiteKeys = [];
        const blackKeyPositions = [0, 1, 3, 4, 5];
        
        for (let octave = startOctave; octave <= endOctave; octave++) {
          for (let i = 0; i < 7; i++) {
            const whiteNote = `${this.whiteNotes[i]}${octave}`;
            allWhiteKeys.push({ note: whiteNote, frequency: this.getFrequency(whiteNote), label: this.whiteNotes[i] });
          }
        }
        
        allWhiteKeys.forEach(key => {
          const whiteKey = document.createElement('div');
          whiteKey.className = 'white-key';
          whiteKey.dataset.note = key.note;
          whiteKey.dataset.frequency = key.frequency;
          
          const label = document.createElement('span');
          label.textContent = key.label;
          whiteKey.appendChild(label);
          
          this.whiteKeysContainer.appendChild(whiteKey);
        });
        
        const totalWhiteKeys = allWhiteKeys.length;
        for (let i = 0; i < totalWhiteKeys; i++) {
          const wrapper = document.createElement('div');
          wrapper.className = 'black-key-wrapper';
          
          const octaveIndex = Math.floor(i / 7);
          const positionInOctave = i % 7;
          
          if (blackKeyPositions.includes(positionInOctave)) {
            const whiteNoteIndex = positionInOctave;
            const noteName = this.whiteNotes[whiteNoteIndex];
            const octave = startOctave + octaveIndex;
            const blackNote = `${noteName}#${octave}`;
            
            const blackKey = document.createElement('div');
            blackKey.className = 'black-key';
            blackKey.dataset.note = blackNote;
            blackKey.dataset.frequency = this.getFrequency(blackNote);
            
            const label = document.createElement('span');
            label.textContent = noteName + '#';
            blackKey.appendChild(label);
            
            wrapper.appendChild(blackKey);
          }
          
          this.blackKeysContainer.appendChild(wrapper);
        }
        
        this.keys = document.querySelectorAll('.white-key, .black-key');
      }

      getFrequency(note) {
        const noteFrequencies = {
          'C2': 65.41, 'C#2': 69.30, 'D2': 73.42, 'D#2': 77.78, 'E2': 82.41,
          'F2': 87.31, 'F#2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00,
          'A#2': 116.54, 'B2': 123.47,
          'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81,
          'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00,
          'A#3': 233.08, 'B3': 246.94,
          'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63,
          'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00,
          'A#4': 466.16, 'B4': 493.88,
          'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25,
          'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00,
          'A#5': 932.33, 'B5': 987.77,
          'C6': 1046.50, 'C#6': 1108.73, 'D6': 1174.66, 'D#6': 1244.51, 'E6': 1318.51,
          'F6': 1396.91, 'F#6': 1479.98, 'G6': 1567.98, 'G#6': 1661.22, 'A6': 1760.00,
          'A#6': 1864.66, 'B6': 1975.53
        };
        
        return noteFrequencies[note] || 440.00;
      }

      init() {
        this.keys.forEach(key => {
          key.addEventListener('mousedown', (e) => {
            e.preventDefault();
            this.isMouseDown = true;
            this.playNote(key);
          });
          key.addEventListener('mouseup', () => {
            this.isMouseDown = false;
            this.releaseKey(key);
          });
          key.addEventListener('mouseleave', () => {
            if (this.isMouseDown) {
              this.releaseKey(key);
            }
          });
          key.addEventListener('mouseenter', () => {
            if (this.isMouseDown) {
              this.playNote(key);
            }
          });
        });

        document.addEventListener('mouseup', () => {
          this.isMouseDown = false;
          this.keys.forEach(key => key.classList.remove('active'));
        });

        document.addEventListener('keydown', (e) => this.handleKeydown(e));
        document.addEventListener('keyup', (e) => this.handleKeyup(e));
      }

      playNote(key) {
        if (key.classList.contains('active')) return;
        
        const note = key.dataset.note;
        const frequency = parseFloat(key.dataset.frequency);

        key.classList.add('active');
        this.noteDisplay.textContent = note;

        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(this.audioContext.destination);

        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);

        gainNode.gain.setValueAtTime(0.4, this.audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 1.2);

        oscillator.start(this.audioContext.currentTime);
        oscillator.stop(this.audioContext.currentTime + 1.2);
      }

      releaseKey(key) {
        key.classList.remove('active');
      }

      handleKeydown(e) {
        const keyMap = {
          'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4',
          'f': 'F4', 't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4',
          'u': 'A#4', 'j': 'B4', 'k': 'C5', 'i': 'C#5', 'l': 'D5',
          'o': 'D#5', 'z': 'E4', 'x': 'F4', 'c': 'G4', 'v': 'A4', 'b': 'B4',
          'n': 'C5', 'm': 'D5', ',': 'E5', '.': 'F5', '/': 'G5',
          'q': 'B3', '2': 'C#4', '3': 'D#4', '5': 'F#4', '6': 'G#4', '7': 'A#4',
          '9': 'C#5', '0': 'D#5', '-': 'F#5', '=': 'G#5'
        };

        const note = keyMap[e.key.toLowerCase()];
        if (note) {
          e.preventDefault();
          const key = document.querySelector(`[data-note="${note}"]`);
          if (key && !key.classList.contains('active')) {
            this.playNote(key);
          }
        }
      }

      handleKeyup(e) {
        const keyMap = {
          'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4',
          'f': 'F4', 't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4',
          'u': 'A#4', 'j': 'B4', 'k': 'C5', 'i': 'C#5', 'l': 'D5',
          'o': 'D#5', 'z': 'E4', 'x': 'F4', 'c': 'G4', 'v': 'A4', 'b': 'B4',
          'n': 'C5', 'm': 'D5', ',': 'E5', '.': 'F5', '/': 'G5',
          'q': 'B3', '2': 'C#4', '3': 'D#4', '5': 'F#4', '6': 'G#4', '7': 'A#4',
          '9': 'C#5', '0': 'D#5', '-': 'F#5', '=': 'G#5'
        };

        const note = keyMap[e.key.toLowerCase()];
        if (note) {
          const key = document.querySelector(`[data-note="${note}"]`);
          if (key) {
            this.releaseKey(key);
          }
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new Piano();
    });
  </script>
</body>
</html>
